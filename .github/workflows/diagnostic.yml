name: AVENZO diagnostic build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f description="AVENZO build passed" -f context="avenzo-build"
          else
            msg=$(grep -E "Module not found|Can't resolve|Type error|SyntaxError|Failed to compile|Build error|Error:" build.log | tail -1 | tr '\\n' ' ' | cut -c1-140)
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f description="${msg:-AVENZO build failed}" -f context="avenzo-build"
          fi
          exit "$code"
