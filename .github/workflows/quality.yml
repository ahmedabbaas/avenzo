name: AVENZO Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - upgrade/premium-social-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: lts

      - name: Check Supabase Edge Functions
        run: deno check supabase/functions/**/*.ts

      - name: Production build
        run: npm run build
