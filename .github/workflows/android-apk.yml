      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AVENZO.apk

      - name: Upload AVENZO APK
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-APK
          path: AVENZO.apk
          if-no-files-found: error
          retention-days: 30
