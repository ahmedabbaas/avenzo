name: Build AVENZO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "mobile-shell/**"
      - "public/avenzo-logo-premium.png"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: avenzo-android-apk-signing
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore stable AVENZO signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: avenzo-android-debug-keystore-v2
          fail-on-cache-miss: true

      - name: Verify stable AVENZO signing key
        shell: bash
        run: |
          test -s "$HOME/.android/debug.keystore"
          expected="5F:C5:51:B7:A2:09:12:A5:42:EE:7B:B6:27:73:C5:51:CE:CA:73:2D:2D:53:B6:19:6D:6E:5D:5B:AA:3A:D9:D2"
          actual="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/.*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "AVENZO signing certificate verified: $actual"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Install dependencies
        run: npm ci

      - name: Sync tracked Android project
        run: npm run android:sync

      - name: Apply AVENZO Android branding and phone frame
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/drawable
          cp public/avenzo-logo-premium.png android/app/src/main/res/drawable-nodpi/avenzo_logo_premium.png
          cat > android/app/src/main/res/drawable/avenzo_notification_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M3.9,19.3 L9.6,5.2 C10.2,3.8 11.8,3.5 12.8,4.6 L20.2,13.1 C21.5,14.6 21.3,17 19.8,18.3 C18.2,19.7 15.9,19.4 14.7,17.8 L11.7,13.7 L9.3,19.3 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M10.1,16.5 a2,2 0,1 0,4 0 a2,2 0,1 0,-4 0"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/avenzo_launcher_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#050607" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#1F5B7CFF" android:pathData="M54,16a38,38 0,1 0,0 76a38,38 0,1 0,0 -76"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#F8FAFF" android:strokeWidth="9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M30,82 L54,25 L78,82"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#5B7CFF" android:strokeWidth="8" android:strokeLineCap="round" android:pathData="M41,61 L67,61"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#3CC8FF" android:strokeWidth="2.2" android:strokeLineCap="round" android:pathData="M25,90 C44,96 68,94 84,84"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application',
                  1
              )
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application',
                  1
              )
          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.CAMERA" />\n    <application',
                  1
              )
          if 'android.permission.MODIFY_AUDIO_SETTINGS' not in s:
              s = s.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application',
                  1
              )
          if 'android:hardwareAccelerated=' not in s:
              s = s.replace(
                  '<application',
                  '<application android:hardwareAccelerated="true"',
                  1
              )
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/avenzo_logo_premium"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/avenzo_logo_premium"')
          if 'android:screenOrientation=' not in s:
              s = s.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:screenOrientation="portrait" android:windowSoftInputMode="adjustResize"'
              )
          manifest.write_text(s)

          styles = Path("android/app/src/main/res/values/styles.xml")
          text = styles.read_text()
          additions = (
              '<item name="android:statusBarColor">@android:color/transparent</item>'
              '<item name="android:navigationBarColor">@android:color/transparent</item>'
              '<item name="android:windowLightStatusBar">false</item>'
              '<item name="android:windowLightNavigationBar">false</item>'
              '<item name="android:windowActionModeOverlay">true</item>'
          )
          if 'android:statusBarColor' not in text:
              text = re.sub(
                  r'(<style name="AppTheme\.NoActionBar"[^>]*>)',
                  r'\1' + additions,
                  text,
                  count=1
              )
          styles.write_text(text)

          # Android 12+ launch splash with the exact AVENZO icon.
          values_v31 = Path("android/app/src/main/res/values-v31")
          values_v31.mkdir(parents=True, exist_ok=True)
          (values_v31 / "styles.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="windowSplashScreenBackground">#050607</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/avenzo_logo_premium</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
            </style>
          </resources>
          """)

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text()
          import os
          version_code = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          gradle_text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", gradle_text, count=1)
          gradle_text = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "0.3.{version_code}"',
              gradle_text,
              count=1
          )
          gradle.write_text(gradle_text)
          PY

      - name: Inject AVENZO native mobile shell
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/avenzo
          cp mobile-shell/app-mobile.css android/app/src/main/assets/avenzo/app-mobile.css
          cp mobile-shell/native-inject.js android/app/src/main/assets/avenzo/native-inject.js
          cp public/avenzo-logo-premium.png android/app/src/main/assets/avenzo/avenzo-logo-premium.png

          python3 - <<'PY'
          from pathlib import Path

          java = r"""package com.avenzo.app;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import android.view.Display;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import com.getcapacitor.BridgeWebChromeClient;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URLEncoder;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.time.Instant;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private static final String MESSAGE_CHANNEL_ID = "avenzo_messages";
            private static final String SUPABASE_URL =
              "https://ltlxynrssgpqgzbdpliv.supabase.co";
            private static final String SUPABASE_KEY =
              "sb_publishable_tAxyIZKlwXyeGI7627SFSQ_VJvaSR0d";

            private boolean avenzoClientInstalled = false;
            private boolean activityVisible = false;
            private PermissionRequest pendingMediaPermissionRequest = null;
            private String[] pendingMediaResources = null;
            private long lastRootBackPress = 0L;
            private String supabaseAccessToken = "";
            private String supabaseUserId = "";
            private String lastNotificationAt = "";
            private String lastIncomingCallId = "";
            private boolean callAudioModeActive = false;
            private int previousAudioMode = AudioManager.MODE_NORMAL;
            private boolean previousSpeakerphone = false;
            private final Handler notificationHandler =
              new Handler(Looper.getMainLooper());
            private final ExecutorService notificationExecutor =
              Executors.newSingleThreadExecutor();
            private volatile boolean notificationPollInFlight = false;

            private final Runnable notificationPoller = new Runnable() {
              @Override
              public void run() {
                if (
                  !activityVisible &&
                  !notificationPollInFlight &&
                  !supabaseAccessToken.isEmpty() &&
                  !supabaseUserId.isEmpty()
                ) {
                  notificationPollInFlight = true;
                  notificationExecutor.execute(() -> {
                    try {
                      pollMessageNotifications();
                      pollIncomingCalls();
                    } finally {
                      notificationPollInFlight = false;
                    }
                  });
                }
                notificationHandler.postDelayed(this, 5000L);
              }
            };

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              getWindow().setSoftInputMode(
                WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
              );
              applySystemTheme("dark");

              preferHighRefreshRate();

              createMessageNotificationChannel();
              requestNotificationPermission();

              getOnBackPressedDispatcher().addCallback(
                this,
                new OnBackPressedCallback(true) {
                  @Override
                  public void handleOnBackPressed() {
                    handleAvenzoBack();
                  }
                }
              );

              configureWebView();
              handleIntentRoute(getIntent());
              notificationHandler.postDelayed(notificationPoller, 3500L);
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              handleIntentRoute(intent);
            }

            @Override
            public void onResume() {
              super.onResume();
              activityVisible = true;
              preferHighRefreshRate();
              configureWebView();

              if (getBridge() != null && getBridge().getWebView() != null) {
                WebView webView = getBridge().getWebView();
                webView.postDelayed(() -> injectAvenzoShell(webView), 120);
                webView.postDelayed(() -> injectAvenzoShell(webView), 700);
              }
            }

            @Override
            public void onPause() {
              activityVisible = false;
              super.onPause();
            }

            @Override
            public void onDestroy() {
              notificationHandler.removeCallbacks(notificationPoller);
              notificationExecutor.shutdownNow();
              setCallAudioMode(false, false);
              super.onDestroy();
            }

            private void createMessageNotificationChannel() {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;

              NotificationChannel channel = new NotificationChannel(
                MESSAGE_CHANNEL_ID,
                "Messages",
                NotificationManager.IMPORTANCE_HIGH
              );
              channel.setDescription("AVENZO messages and incoming calls");
              channel.enableVibration(true);

              NotificationManager manager =
                (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
              manager.createNotificationChannel(channel);
            }

            private void requestNotificationPermission() {
              if (
                Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                  != PackageManager.PERMISSION_GRANTED
              ) {
                requestPermissions(
                  new String[]{Manifest.permission.POST_NOTIFICATIONS},
                  4201
                );
              }
            }

            private boolean mediaResourcesGranted(String[] resources) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return true;

              for (String resource : resources) {
                if (
                  PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource) &&
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                    != PackageManager.PERMISSION_GRANTED
                ) {
                  return false;
                }

                if (
                  PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) &&
                  checkSelfPermission(Manifest.permission.CAMERA)
                    != PackageManager.PERMISSION_GRANTED
                ) {
                  return false;
                }
              }

              return true;
            }

            private void requestRuntimeMediaPermissions(String[] resources) {
              boolean needsAudio = false;
              boolean needsCamera = false;

              for (String resource : resources) {
                if (
                  PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource) &&
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                    != PackageManager.PERMISSION_GRANTED
                ) {
                  needsAudio = true;
                }

                if (
                  PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) &&
                  checkSelfPermission(Manifest.permission.CAMERA)
                    != PackageManager.PERMISSION_GRANTED
                ) {
                  needsCamera = true;
                }
              }

              if (needsAudio && needsCamera) {
                requestPermissions(
                  new String[]{
                    Manifest.permission.RECORD_AUDIO,
                    Manifest.permission.CAMERA
                  },
                  4202
                );
              } else if (needsAudio) {
                requestPermissions(
                  new String[]{Manifest.permission.RECORD_AUDIO},
                  4202
                );
              } else if (needsCamera) {
                requestPermissions(
                  new String[]{Manifest.permission.CAMERA},
                  4202
                );
              }
            }

            @Override
            public void onRequestPermissionsResult(
              int requestCode,
              String[] permissions,
              int[] grantResults
            ) {
              super.onRequestPermissionsResult(
                requestCode,
                permissions,
                grantResults
              );

              if (requestCode != 4202) return;

              PermissionRequest pending = pendingMediaPermissionRequest;
              String[] resources = pendingMediaResources;
              pendingMediaPermissionRequest = null;
              pendingMediaResources = null;

              if (pending == null || resources == null) return;

              if (mediaResourcesGranted(resources)) {
                pending.grant(resources);
              } else {
                pending.deny();
              }
            }

            private void showMessageNotification(
              String title,
              String body,
              String route
            ) {
              if (
                Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                  != PackageManager.PERMISSION_GRANTED
              ) {
                return;
              }

              String safeRoute =
                route != null && route.startsWith("/") ? route : "/messages";

              Intent intent = new Intent(this, MainActivity.class);
              intent.putExtra("avenzo_route", safeRoute);
              intent.addFlags(
                Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP
              );

              int flags = PendingIntent.FLAG_UPDATE_CURRENT;
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                flags |= PendingIntent.FLAG_IMMUTABLE;
              }

              PendingIntent pendingIntent = PendingIntent.getActivity(
                this,
                Math.abs(safeRoute.hashCode()),
                intent,
                flags
              );

              Notification.Builder builder =
                Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                  ? new Notification.Builder(this, MESSAGE_CHANNEL_ID)
                  : new Notification.Builder(this);

              builder
                .setSmallIcon(R.drawable.avenzo_notification_icon)
                .setLargeIcon(
                  BitmapFactory.decodeResource(
                    getResources(),
                    R.drawable.avenzo_logo_premium
                  )
                )
                .setContentTitle(
                  title == null || title.trim().isEmpty() ? "AVENZO" : title
                )
                .setContentText(
                  body == null || body.trim().isEmpty()
                    ? "New message"
                    : body
                )
                .setStyle(
                  new Notification.BigTextStyle().bigText(
                    body == null || body.trim().isEmpty()
                      ? "New message"
                      : body
                  )
                )
                .setAutoCancel(true)
                .setContentIntent(pendingIntent)
                .setCategory(Notification.CATEGORY_MESSAGE);

              NotificationManager manager =
                (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
              manager.notify(
                (int) (System.currentTimeMillis() & 0x0fffffff),
                builder.build()
              );
            }

            private boolean isMessagesScreenVisible() {
              if (!activityVisible) return false;
              if (getBridge() == null || getBridge().getWebView() == null) {
                return false;
              }
              String url = getBridge().getWebView().getUrl();
              return url != null && url.contains("/messages");
            }

            private String notificationBody(String type) {
              if ("message_request".equals(type)) {
                return "You have a new message request";
              }
              if ("message_reply".equals(type)) {
                return "Someone replied to your message";
              }
              return "You have a new message";
            }

            private void pollMessageNotifications() {
              String token = supabaseAccessToken;
              String userId = supabaseUserId;
              String cursor = lastNotificationAt;

              if (
                token.isEmpty() ||
                userId.isEmpty() ||
                cursor.isEmpty()
              ) {
                return;
              }

              HttpURLConnection connection = null;
              try {
                String encodedCursor = URLEncoder.encode(
                  cursor,
                  StandardCharsets.UTF_8.name()
                );

                String endpoint =
                  SUPABASE_URL +
                  "/rest/v1/notifications" +
                  "?recipient_id=eq." + userId +
                  "&type=in.(message,message_request,message_reply)" +
                  "&created_at=gt." + encodedCursor +
                  "&select=id,type,created_at" +
                  "&order=created_at.asc" +
                  "&limit=20";

                connection = (HttpURLConnection) new URL(endpoint).openConnection();
                connection.setRequestMethod("GET");
                connection.setConnectTimeout(8000);
                connection.setReadTimeout(8000);
                connection.setRequestProperty("apikey", SUPABASE_KEY);
                connection.setRequestProperty(
                  "Authorization",
                  "Bearer " + token
                );
                connection.setRequestProperty("Accept", "application/json");

                int code = connection.getResponseCode();
                if (code != 200) return;

                StringBuilder body = new StringBuilder();
                try (
                  BufferedReader reader = new BufferedReader(
                    new InputStreamReader(
                      connection.getInputStream(),
                      StandardCharsets.UTF_8
                    )
                  )
                ) {
                  String line;
                  while ((line = reader.readLine()) != null) {
                    body.append(line);
                  }
                }

                JSONArray rows = new JSONArray(body.toString());
                for (int i = 0; i < rows.length(); i++) {
                  JSONObject row = rows.getJSONObject(i);
                  String type = row.optString("type", "message");
                  String createdAt = row.optString("created_at", cursor);

                  if (!isMessagesScreenVisible()) {
                    runOnUiThread(
                      () -> showMessageNotification(
                        "AVENZO",
                        notificationBody(type),
                        "/messages"
                      )
                    );
                  }

                  if (!createdAt.isEmpty()) {
                    lastNotificationAt = createdAt;
                  }
                }
              } catch (Exception ignored) {
              } finally {
                if (connection != null) connection.disconnect();
              }
            }

            private void pollIncomingCalls() {
              String token = supabaseAccessToken;
              String userId = supabaseUserId;
              if (token.isEmpty() || userId.isEmpty()) return;

              HttpURLConnection connection = null;
              try {
                String endpoint =
                  SUPABASE_URL +
                  "/rest/v1/call_sessions" +
                  "?callee_id=eq." + userId +
                  "&status=eq.ringing" +
                  "&select=id,call_type,created_at" +
                  "&order=created_at.desc" +
                  "&limit=1";

                connection = (HttpURLConnection) new URL(endpoint).openConnection();
                connection.setRequestMethod("GET");
                connection.setConnectTimeout(8000);
                connection.setReadTimeout(8000);
                connection.setRequestProperty("apikey", SUPABASE_KEY);
                connection.setRequestProperty(
                  "Authorization",
                  "Bearer " + token
                );
                connection.setRequestProperty("Accept", "application/json");

                if (connection.getResponseCode() != 200) return;

                StringBuilder body = new StringBuilder();
                try (
                  BufferedReader reader = new BufferedReader(
                    new InputStreamReader(
                      connection.getInputStream(),
                      StandardCharsets.UTF_8
                    )
                  )
                ) {
                  String line;
                  while ((line = reader.readLine()) != null) {
                    body.append(line);
                  }
                }

                JSONArray rows = new JSONArray(body.toString());
                if (rows.length() == 0) return;

                JSONObject row = rows.getJSONObject(0);
                String callId = row.optString("id", "");
                if (callId.isEmpty() || callId.equals(lastIncomingCallId)) return;

                lastIncomingCallId = callId;
                String callType = row.optString("call_type", "audio");
                String message =
                  "video".equals(callType)
                    ? "Incoming video call · Open AVENZO to answer"
                    : "Incoming voice call · Open AVENZO to answer";

                runOnUiThread(
                  () -> showMessageNotification(
                    "Incoming AVENZO call",
                    message,
                    "/messages"
                  )
                );
              } catch (Exception ignored) {
              } finally {
                if (connection != null) connection.disconnect();
              }
            }

            private void registerNotificationSession(
              String accessToken,
              String userId
            ) {
              if (
                accessToken == null ||
                accessToken.trim().isEmpty() ||
                userId == null ||
                userId.trim().isEmpty()
              ) {
                supabaseAccessToken = "";
                supabaseUserId = "";
                lastNotificationAt = "";
                lastIncomingCallId = "";
                return;
              }

              boolean userChanged = !userId.equals(supabaseUserId);
              supabaseAccessToken = accessToken;
              supabaseUserId = userId;

              if (userChanged || lastNotificationAt.isEmpty()) {
                lastNotificationAt = Instant.now().toString();
              }
              if (userChanged) {
                lastIncomingCallId = "";
              }
            }

            private void setCallAudioMode(boolean active, boolean speaker) {
              AudioManager audioManager =
                (AudioManager) getSystemService(Context.AUDIO_SERVICE);
              if (audioManager == null) return;

              if (active) {
                if (!callAudioModeActive) {
                  previousAudioMode = audioManager.getMode();
                  previousSpeakerphone = audioManager.isSpeakerphoneOn();
                  callAudioModeActive = true;
                }
                audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                audioManager.setSpeakerphoneOn(speaker);
                return;
              }

              if (!callAudioModeActive) return;
              audioManager.setSpeakerphoneOn(previousSpeakerphone);
              audioManager.setMode(previousAudioMode);
              callAudioModeActive = false;
            }

            private void handleIntentRoute(Intent intent) {
              if (intent == null) return;
              String route = intent.getStringExtra("avenzo_route");
              if (route == null || !route.startsWith("/")) return;

              if (getBridge() != null && getBridge().getWebView() != null) {
                WebView webView = getBridge().getWebView();
                String target = "https://avenzo-ivory.vercel.app" + route;
                webView.post(() -> webView.loadUrl(target));
              }
            }

            private void applySystemTheme(String theme) {
              final boolean light = "light".equalsIgnoreCase(theme);
              final View decor = getWindow().getDecorView();

              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              getWindow().setStatusBarColor(Color.TRANSPARENT);
              getWindow().setNavigationBarColor(Color.TRANSPARENT);

              int flags =
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION;

              if (light && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                flags |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
              }

              if (light && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
              }

              decor.setSystemUiVisibility(flags);

              WindowInsetsControllerCompat controller =
                WindowCompat.getInsetsController(getWindow(), decor);
              controller.setAppearanceLightStatusBars(light);
              controller.setAppearanceLightNavigationBars(light);

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                getWindow().setStatusBarContrastEnforced(false);
                getWindow().setNavigationBarContrastEnforced(false);
              }
            }

            private void preferHighRefreshRate() {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return;

              Display display = getDisplay();
              if (display == null) return;

              Display.Mode current = display.getMode();
              Display.Mode best = current;

              for (Display.Mode mode : display.getSupportedModes()) {
                boolean sameResolution =
                  mode.getPhysicalWidth() == current.getPhysicalWidth() &&
                  mode.getPhysicalHeight() == current.getPhysicalHeight();

                if (sameResolution && mode.getRefreshRate() > best.getRefreshRate()) {
                  best = mode;
                }
              }

              WindowManager.LayoutParams params = getWindow().getAttributes();
              params.preferredDisplayModeId = best.getModeId();
              params.preferredRefreshRate = best.getRefreshRate();
              getWindow().setAttributes(params);
            }

            private void configureWebView() {
              if (
                avenzoClientInstalled ||
                getBridge() == null ||
                getBridge().getWebView() == null
              ) {
                return;
              }

              final WebView webView = getBridge().getWebView();
              webView.setOverScrollMode(WebView.OVER_SCROLL_IF_CONTENT_SCROLLS);
              webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                webView.setRendererPriorityPolicy(
                  WebView.RENDERER_PRIORITY_IMPORTANT,
                  false
                );
              }
              webView.setVerticalScrollBarEnabled(false);
              webView.setHorizontalScrollBarEnabled(false);
              WebSettings settings = webView.getSettings();
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);
              settings.setMediaPlaybackRequiresUserGesture(false);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setCacheMode(WebSettings.LOAD_DEFAULT);
              webView.addJavascriptInterface(
                new AvenzoNativeBridge(),
                "AvenzoNative"
              );

              webView.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                @Override
                public void onPermissionRequest(PermissionRequest request) {
                  runOnUiThread(() -> {
                    String host =
                      request.getOrigin() == null
                        ? ""
                        : request.getOrigin().getHost();

                    if (!"avenzo-ivory.vercel.app".equalsIgnoreCase(host)) {
                      request.deny();
                      return;
                    }

                    String[] resources = request.getResources();
                    if (mediaResourcesGranted(resources)) {
                      request.grant(resources);
                      return;
                    }

                    if (pendingMediaPermissionRequest != null) {
                      pendingMediaPermissionRequest.deny();
                    }

                    pendingMediaPermissionRequest = request;
                    pendingMediaResources = resources;
                    requestRuntimeMediaPermissions(resources);
                  });
                }

                @Override
                public void onPermissionRequestCanceled(
                  PermissionRequest request
                ) {
                  if (pendingMediaPermissionRequest == request) {
                    pendingMediaPermissionRequest = null;
                    pendingMediaResources = null;
                  }
                  super.onPermissionRequestCanceled(request);
                }
              });

              webView.setWebViewClient(new BridgeWebViewClient(getBridge()) {
                @Override
                public void onPageFinished(WebView view, String url) {
                  super.onPageFinished(view, url);
                  injectAvenzoShell(view);
                  view.postDelayed(() -> injectAvenzoShell(view), 180);
                  view.postDelayed(() -> injectAvenzoShell(view), 800);
                }

                @Override
                public void doUpdateVisitedHistory(
                  WebView view,
                  String url,
                  boolean isReload
                ) {
                  super.doUpdateVisitedHistory(view, url, isReload);
                  view.postDelayed(() -> injectAvenzoShell(view), 80);
                  view.postDelayed(() -> injectAvenzoShell(view), 350);
                }
              });

              avenzoClientInstalled = true;
              webView.postDelayed(() -> injectAvenzoShell(webView), 100);
              webView.postDelayed(() -> injectAvenzoShell(webView), 500);
              webView.postDelayed(() -> injectAvenzoShell(webView), 1500);
            }

            private class AvenzoNativeBridge {
              @JavascriptInterface
              public void notifyMessage(
                String title,
                String body,
                String route
              ) {
                runOnUiThread(
                  () -> showMessageNotification(title, body, route)
                );
              }

              @JavascriptInterface
              public void registerSession(
                String accessToken,
                String userId
              ) {
                registerNotificationSession(accessToken, userId);
              }

              @JavascriptInterface
              public void setSystemTheme(String theme) {
                runOnUiThread(() -> applySystemTheme(theme));
              }

              @JavascriptInterface
              public void setCallAudioMode(boolean active, boolean speaker) {
                runOnUiThread(() -> MainActivity.this.setCallAudioMode(active, speaker));
              }
            }

            private void handleAvenzoBack() {
              if (getBridge() == null || getBridge().getWebView() == null) {
                handleRootExit();
                return;
              }

              final WebView webView = getBridge().getWebView();
              webView.evaluateJavascript(
                "(function(){try{return window.__avenzoHandleBack?window.__avenzoHandleBack():'history';}catch(e){return 'history';}})();",
                result -> {
                  if ("\"handled\"".equals(result)) {
                    lastRootBackPress = 0L;
                    return;
                  }

                  if ("\"history\"".equals(result)) {
                    lastRootBackPress = 0L;
                    if (webView.canGoBack()) {
                      webView.goBack();
                    } else {
                      webView.loadUrl("https://avenzo-ivory.vercel.app/home");
                    }
                    return;
                  }

                  handleRootExit();
                }
              );
            }

            private void handleRootExit() {
              long now = System.currentTimeMillis();
              if (now - lastRootBackPress <= 2000L) {
                lastRootBackPress = 0L;
                moveTaskToBack(true);
                return;
              }

              lastRootBackPress = now;
              Toast.makeText(
                this,
                "Press back again to exit",
                Toast.LENGTH_SHORT
              ).show();
            }

            private String readAssetText(String path) throws Exception {
              try (
                InputStream input = getAssets().open(path);
                ByteArrayOutputStream output = new ByteArrayOutputStream()
              ) {
                byte[] buffer = new byte[8192];
                int read;
                while ((read = input.read(buffer)) != -1) {
                  output.write(buffer, 0, read);
                }
                return output.toString(StandardCharsets.UTF_8.name());
              }
            }

            private String readAssetBase64(String path) throws Exception {
              try (
                InputStream input = getAssets().open(path);
                ByteArrayOutputStream output = new ByteArrayOutputStream()
              ) {
                byte[] buffer = new byte[8192];
                int read;
                while ((read = input.read(buffer)) != -1) {
                  output.write(buffer, 0, read);
                }
                return Base64.encodeToString(
                  output.toByteArray(),
                  Base64.NO_WRAP
                );
              }
            }

            private void injectAvenzoShell(WebView view) {
              try {
                String script = readAssetText("avenzo/native-inject.js");
                script = script.replace(
                  "__CSS__",
                  readAssetBase64("avenzo/app-mobile.css")
                );
                script = script.replace(
                  "__LOGO_PNG__",
                  readAssetBase64("avenzo/avenzo-logo-premium.png")
                );
                view.evaluateJavascript(script, null);
              } catch (Exception ignored) {
              }
            }
          }
