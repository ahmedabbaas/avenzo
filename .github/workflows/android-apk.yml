name: Build AVENZO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "mobile-shell/**"
      - "public/avenzo-logo.webp"
      - "app/globals.css"
      - "app/layout.tsx"
      - "app/manifest.ts"
      - "components/brand-logo.tsx"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7

      - name: Add Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Apply AVENZO Android branding and phone frame
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp public/avenzo-logo.webp android/app/src/main/res/drawable-nodpi/avenzo_logo.webp
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/avenzo_logo"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/avenzo_logo"')
          if 'android:screenOrientation=' not in s:
              s = s.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:screenOrientation="portrait"'
              )
          manifest.write_text(s)

          styles = Path("android/app/src/main/res/values/styles.xml")
          text = styles.read_text()
          additions = (
              '<item name="android:statusBarColor">#06080a</item>'
              '<item name="android:navigationBarColor">#06080a</item>'
              '<item name="android:windowLightStatusBar">false</item>'
              '<item name="android:windowLightNavigationBar">false</item>'
          )
          if 'android:statusBarColor' not in text:
              text = re.sub(
                  r'(<style name="AppTheme\.NoActionBar"[^>]*>)',
                  r'\1' + additions,
                  text,
                  count=1
              )
          styles.write_text(text)
          PY

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AVENZO.apk

      - name: Upload AVENZO APK
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-APK
          path: AVENZO.apk
          if-no-files-found: error
          retention-days: 30
