name: Build AVENZO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "mobile-shell/**"
      - "public/avenzo-logo-premium.png"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: avenzo-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore stable AVENZO debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: avenzo-android-debug-keystore-v2
          fail-on-cache-miss: true

      - name: Verify stable AVENZO debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          expected="5F:C5:51:B7:A2:09:12:A5:42:EE:7B:B6:27:73:C5:51:CE:CA:73:2D:2D:53:B6:19:6D:6E:5D:5B:AA:3A:D9:D2"
          actual="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/.*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "AVENZO debug signing certificate verified: $actual"

      - name: Install dependencies
        run: npm ci

      - name: Sync tracked Android project
        run: npm run android:sync

      - name: Prepare AVENZO native assets and debug version
        shell: bash
        run: |
          set -euo pipefail

          # MainActivity, Manifest and Android themes are tracked source files.
          # Do not regenerate them here: CI must test exactly what is in Git.
          test -s android/app/src/main/java/com/avenzo/app/MainActivity.java
          test -s android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/assets/avenzo
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp mobile-shell/app-mobile.css android/app/src/main/assets/avenzo/app-mobile.css
          cp mobile-shell/native-inject.js android/app/src/main/assets/avenzo/native-inject.js
          cp public/avenzo-logo-premium.png android/app/src/main/assets/avenzo/avenzo-logo-premium.png
          cp public/avenzo-logo-premium.png android/app/src/main/res/drawable-nodpi/avenzo_logo_premium.png

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          version_code = int(os.environ["GITHUB_RUN_NUMBER"])
          text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "1.8.{version_code}-debug"',
              text,
              count=1,
          )
          gradle.write_text(text)
          PY

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          export AVENZO_DEBUG_STORE_FILE="$HOME/.android/debug.keystore"
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee AVENZO-signing.txt
          expected="5fc551b7a20912a542ee7bb62773c551ceca732d2d53b6196d6e5d5baa3ad9d2"
          actual="$(sed -n 's/.*certificate SHA-256 digest: //p' AVENZO-signing.txt | head -n 1)"
          test "$actual" = "$expected"

          cp "$APK" AVENZO.apk
          sha256sum AVENZO.apk > AVENZO-sha256.txt
          ls -lh AVENZO.apk AVENZO-sha256.txt
          # Small transfer artifacts are reassembled byte-for-byte into the same signed APK.
          split -b 24M -d -a 2 AVENZO.apk AVENZO.apk.part-
          python3 - <<'PYINFO'
          import hashlib, json, os
          from pathlib import Path
          apk = Path("AVENZO.apk")
          assert apk.stat().st_size >= 100 * 1024 * 1024, "Premium APK must contain at least 100 MiB of real functionality"
          assert apk.stat().st_size <= 6 * 24 * 1024 * 1024, "Add transfer slots before publishing this larger APK"
          Path("AVENZO-build-info.json").write_text(json.dumps({
              "commit": os.environ["GITHUB_SHA"],
              "version_code": int(os.environ["GITHUB_RUN_NUMBER"]),
              "size_bytes": apk.stat().st_size,
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "abis": ["arm64-v8a", "armeabi-v7a"],
              "offline_tools": ["Smart Alt", "Latin OCR", "Chinese OCR", "Devanagari OCR", "Japanese OCR", "Korean OCR", "Portrait background removal", "Accurate 4:5 framing", "QR and barcode scanning"],
              "signing": "stable-debug"
          }, indent=2))
          PYINFO

      - name: Upload AVENZO APK
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-APK
          path: |
            AVENZO.apk
            AVENZO-sha256.txt
            AVENZO-build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK transfer part 01
        if: hashFiles('AVENZO.apk.part-00') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-Transfer-01
          path: |
            AVENZO.apk.part-00
            AVENZO-sha256.txt
            AVENZO-build-info.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK transfer part 02
        if: hashFiles('AVENZO.apk.part-01') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-Transfer-02
          path: |
            AVENZO.apk.part-01
            AVENZO-sha256.txt
            AVENZO-build-info.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK transfer part 03
        if: hashFiles('AVENZO.apk.part-02') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-Transfer-03
          path: |
            AVENZO.apk.part-02
            AVENZO-sha256.txt
            AVENZO-build-info.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK transfer part 04
        if: hashFiles('AVENZO.apk.part-03') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-Transfer-04
          path: |
            AVENZO.apk.part-03
            AVENZO-sha256.txt
            AVENZO-build-info.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK transfer part 05
        if: hashFiles('AVENZO.apk.part-04') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-Transfer-05
          path: |
            AVENZO.apk.part-04
            AVENZO-sha256.txt
            AVENZO-build-info.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK transfer part 06
        if: hashFiles('AVENZO.apk.part-05') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-Transfer-06
          path: |
            AVENZO.apk.part-05
            AVENZO-sha256.txt
            AVENZO-build-info.json
          if-no-files-found: error
          retention-days: 7
