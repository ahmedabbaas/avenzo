name: Build AVENZO Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: avenzo-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AVENZO_RELEASE_STORE_FILE: ${{ runner.temp }}/avenzo-release.jks
      AVENZO_RELEASE_STORE_PASSWORD: ${{ secrets.AVENZO_ANDROID_KEYSTORE_PASSWORD }}
      AVENZO_RELEASE_KEY_ALIAS: ${{ secrets.AVENZO_ANDROID_KEY_ALIAS }}
      AVENZO_RELEASE_KEY_PASSWORD: ${{ secrets.AVENZO_ANDROID_KEY_PASSWORD }}
      AVENZO_ANDROID_KEYSTORE_BASE64: ${{ secrets.AVENZO_ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AVENZO_ANDROID_KEYSTORE_BASE64"
          test -n "$AVENZO_RELEASE_STORE_PASSWORD"
          test -n "$AVENZO_RELEASE_KEY_ALIAS"
          test -n "$AVENZO_RELEASE_KEY_PASSWORD"
          printf '%s' "$AVENZO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$AVENZO_RELEASE_STORE_FILE"
          test -s "$AVENZO_RELEASE_STORE_FILE"
          keytool -list             -keystore "$AVENZO_RELEASE_STORE_FILE"             -storepass "$AVENZO_RELEASE_STORE_PASSWORD"             -alias "$AVENZO_RELEASE_KEY_ALIAS" >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Prepare AVENZO native assets and release version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/avenzo
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp mobile-shell/app-mobile.css android/app/src/main/assets/avenzo/app-mobile.css
          cp mobile-shell/native-inject.js android/app/src/main/assets/avenzo/native-inject.js
          cp public/avenzo-logo-premium.png android/app/src/main/assets/avenzo/avenzo-logo-premium.png
          cp public/avenzo-logo-premium.png android/app/src/main/res/drawable-nodpi/avenzo_logo_premium.png

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          version_code = int(os.environ["GITHUB_RUN_NUMBER"])
          text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "1.8.{version_code}"',
              text,
              count=1,
          )
          gradle.write_text(text)
          PY

      - name: Build signed release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB" >/dev/null

      - name: Package release artifacts
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AVENZO-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab AVENZO-release.aab
          sha256sum AVENZO-release.apk AVENZO-release.aab > AVENZO-release-sha256.txt

      - name: Upload signed AVENZO release
        uses: actions/upload-artifact@v4
        with:
          name: AVENZO-Android-Release
          path: |
            AVENZO-release.apk
            AVENZO-release.aab
            AVENZO-release-sha256.txt
          if-no-files-found: error
          retention-days: 30
